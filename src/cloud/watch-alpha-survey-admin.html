<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch Alpha Survey Admin</title>
    <style>
      :root {
        --bg: #000000;
        --bg-2: #06110d;
        --card: rgba(8, 15, 12, 0.88);
        --line: rgba(122, 160, 141, 0.34);
        --line-strong: rgba(172, 217, 193, 0.56);
        --ink: #e8fff1;
        --muted: #8eb29d;
        --accent: #2e9662;
        --accent-2: #1b6f47;
        --danger: #ff6f7d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "SF Mono", "JetBrains Mono", "IBM Plex Mono", "Menlo", "Consolas", monospace;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, rgba(16, 88, 52, 0.36), transparent 34%),
          radial-gradient(circle at 84% 12%, rgba(62, 136, 94, 0.2), transparent 30%),
          linear-gradient(165deg, var(--bg) 0%, var(--bg-2) 54%, var(--bg) 100%);
        min-height: 100vh;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(112, 224, 0, 0.08) 0,
            rgba(112, 224, 0, 0.08) 1px,
            transparent 1px,
            transparent 5px
          );
        opacity: 0.28;
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1280px;
        margin: 18px auto;
        padding: 0 12px 24px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 10px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        padding: 14px;
        background:
          linear-gradient(120deg, rgba(16, 33, 25, 0.8), rgba(7, 17, 13, 0.95)),
          radial-gradient(circle at 84% 20%, rgba(60, 181, 111, 0.18), transparent 44%);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.45);
      }
      h1 { margin: 0; font-size: 25px; letter-spacing: 0.25px; }
      .meta { color: var(--muted); font-size: 12px; line-height: 1.6; }
      .nav { display: flex; gap: 8px; flex-wrap: wrap; }
      .nav a, .nav button {
        border: 1px solid rgba(129, 173, 151, 0.44);
        border-radius: 999px;
        background: rgba(7, 14, 11, 0.78);
        color: var(--ink);
        text-decoration: none;
        font: inherit;
        font-size: 12px;
        padding: 8px 11px;
        cursor: pointer;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
        margin-bottom: 10px;
      }
      .row { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; }
      .field { display: grid; gap: 6px; }
      label { font-size: 12px; color: var(--muted); }
      input {
        min-width: 180px;
        border: 1px solid rgba(124, 160, 141, 0.36);
        border-radius: 8px;
        padding: 9px 10px;
        font: inherit;
        background: rgba(4, 10, 8, 0.88);
        color: var(--ink);
      }
      button.primary {
        border: 1px solid rgba(154, 221, 186, 0.56);
        border-radius: 8px;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #f2fff7;
        padding: 10px 14px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button.primary:hover { filter: brightness(1.08); }
      button.ghost {
        border: 1px solid rgba(124, 160, 141, 0.5);
        border-radius: 8px;
        background: rgba(7, 14, 11, 0.82);
        color: var(--ink);
        padding: 10px 14px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th, td {
        border: 1px solid rgba(122, 160, 141, 0.32);
        padding: 7px 8px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: rgba(15, 34, 25, 0.92);
        color: #d9f8e5;
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
      .muted { color: var(--muted); }
      .status { min-height: 20px; }
      .ok { color: #90e2ae; }
      .err { color: var(--danger); }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .chip {
        border: 1px solid rgba(129, 173, 151, 0.45);
        border-radius: 999px;
        padding: 2px 7px;
        background: rgba(60, 181, 111, 0.14);
      }
      .title-sub {
        margin-top: 8px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .badge {
        border: 1px solid rgba(152, 210, 178, 0.48);
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        color: #bce8cc;
        background: rgba(13, 35, 26, 0.72);
      }
      @media (max-width: 900px) {
        .hero { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <div>
          <h1>WATCH ALPHA // SURVEY RESULTS</h1>
          <div class="meta">管理员查看问卷列表、按时间筛选并导出 CSV。</div>
          <div class="title-sub">
            <span class="badge">ADMIN CONSOLE</span>
            <span class="badge">MATRIX DENSITY</span>
            <span class="badge">READ-ONLY ANALYTICS</span>
          </div>
        </div>
        <div class="nav">
          <a href="/survey/watch-alpha" target="_blank" rel="noreferrer">打开问卷页</a>
          <a href="/auth/users-ui">用户管理</a>
          <a href="/auth/device-tokens-ui">设备 Token</a>
          <form method="post" action="/auth/logout" style="display:inline;">
            <input type="hidden" name="returnTo" value="/auth/login" />
            <button type="submit">退出登录</button>
          </form>
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <div class="field">
            <label for="limit">最大条数</label>
            <input id="limit" type="number" min="1" max="5000" value="200" />
          </div>
          <div class="field">
            <label for="fromMs">起始时间戳（毫秒，可选）</label>
            <input id="fromMs" type="number" min="0" placeholder="如 1785600000000" />
          </div>
          <div class="field">
            <label for="toMs">结束时间戳（毫秒，可选）</label>
            <input id="toMs" type="number" min="0" placeholder="如 1785700000000" />
          </div>
          <button id="refreshBtn" class="primary" type="button">刷新列表</button>
          <button id="exportBtn" class="ghost" type="button">导出 CSV</button>
        </div>
        <div id="status" class="status meta" style="margin-top:10px;"></div>
      </div>

      <div class="panel">
        <div id="summary" class="meta">加载中...</div>
        <div id="table" style="margin-top:10px;"></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const limitEl = $("limit");
      const fromMsEl = $("fromMs");
      const toMsEl = $("toMs");
      const refreshBtn = $("refreshBtn");
      const exportBtn = $("exportBtn");
      const statusEl = $("status");
      const summaryEl = $("summary");
      const tableEl = $("table");

      function toInt(value, fallback) {
        const n = Number.parseInt(String(value || "").trim(), 10);
        return Number.isFinite(n) && n > 0 ? n : fallback;
      }

      function toTs(value) {
        const n = Number.parseInt(String(value || "").trim(), 10);
        return Number.isFinite(n) && n > 0 ? n : 0;
      }

      function fmtTime(ms) {
        if (!ms) return "-";
        return new Date(ms).toLocaleString();
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (c) => {
          switch (c) {
            case "&": return "&amp;";
            case "<": return "&lt;";
            case ">": return "&gt;";
            case '"': return "&quot;";
            case "'": return "&#39;";
            default: return c;
          }
        });
      }

      function setStatus(text, ok) {
        statusEl.textContent = text;
        statusEl.className = ok ? "status meta ok" : "status meta err";
      }

      function queryString() {
        const limit = Math.min(toInt(limitEl.value, 200), 5000);
        const fromMs = toTs(fromMsEl.value);
        const toMs = toTs(toMsEl.value);
        const params = new URLSearchParams();
        params.set("limit", String(limit));
        if (fromMs > 0) params.set("fromMs", String(fromMs));
        if (toMs > 0) params.set("toMs", String(toMs));
        return params.toString();
      }

      function render(items) {
        if (!Array.isArray(items) || items.length === 0) {
          tableEl.innerHTML = '<div class="muted">暂无数据</div>';
          return;
        }

        const rows = items.map((item, index) => {
          const usageScenarios = Array.isArray(item.usageScenarios)
            ? item.usageScenarios.map((s) => `<span class="chip">${escapeHtml(s)}</span>`).join("")
            : "";

          const scores = [
            item.installIphoneScore,
            item.installWatchScore,
            item.permissionGuideScore,
            item.loginStabilityScore,
            item.pairingFlowScore,
            item.pairingStatusScore,
            item.approvalArrivalScore,
            item.approvalReliabilityScore,
            item.cardCompletenessScore,
          ].map((v) => (v == null ? "-" : String(v))).join("/");

          return [
            "<tr>",
            `<td>${index + 1}</td>`,
            `<td class="mono">${escapeHtml(item.id || "-")}</td>`,
            `<td>${fmtTime(item.submittedAtMs)}</td>`,
            `<td>${escapeHtml(item.userId || "-")}</td>`,
            `<td>${escapeHtml(item.username || "-")}</td>`,
            `<td>${escapeHtml(item.contact || "-")}</td>`,
            `<td>${escapeHtml(item.terminalUsed || "-")}</td>`,
            `<td>${escapeHtml(item.usageFrequency || "-")}</td>`,
            `<td><div class="chips">${usageScenarios}</div><div class="muted">${escapeHtml(item.usageScenariosOther || "")}</div></td>`,
            `<td>${scores}</td>`,
            `<td>${escapeHtml(item.nextPriority || "-")}<div class="muted">${escapeHtml(item.nextPriorityOther || "")}</div></td>`,
            `<td>${escapeHtml(item.extraFeedback || "")}</td>`,
            "</tr>",
          ].join("");
        }).join("");

        tableEl.innerHTML = [
          "<table>",
          "<thead><tr>",
          "<th>#</th><th>ID</th><th>提交时间</th><th>UserID</th><th>昵称</th><th>联系方式</th><th>终端</th><th>频率</th><th>场景</th><th>九项评分</th><th>下版优先项</th><th>补充反馈</th>",
          "</tr></thead>",
          `<tbody>${rows}</tbody>`,
          "</table>",
        ].join("");
      }

      async function loadSurveys() {
        setStatus("加载中...", true);
        const qs = queryString();
        const url = `/api/admin/surveys/watch-alpha?${qs}`;
        try {
          const res = await fetch(url, {
            headers: {
              Accept: "application/json",
            },
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data?.ok) {
            throw new Error(data?.error || `请求失败（${res.status}）`);
          }

          const items = Array.isArray(data.items) ? data.items : [];
          render(items);
          summaryEl.textContent = `已加载 ${items.length} 条，符合筛选总数 ${data.total ?? items.length}。`;
          setStatus("加载成功", true);
        } catch (error) {
          summaryEl.textContent = "加载失败";
          tableEl.innerHTML = "";
          setStatus(`加载失败：${String(error?.message || error)}`, false);
        }
      }

      function exportCsv() {
        const qs = queryString();
        const url = `/api/admin/surveys/watch-alpha.csv?${qs}`;
        window.location.href = url;
      }

      refreshBtn.addEventListener("click", loadSurveys);
      exportBtn.addEventListener("click", exportCsv);

      loadSurveys();
    </script>
  </body>
</html>
