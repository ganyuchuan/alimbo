<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Limbo Survey</title>
    <style>
      :root {
        --bg: #080808;
        --bg-soft: #121212;
        --panel: #111111;
        --panel-soft: rgba(255, 255, 255, 0.03);
        --stroke: rgba(132, 132, 132, 0.72);
        --stroke-soft: rgba(132, 132, 132, 0.45);
        --text: #f3f3f3;
        --text-dim: #9e9e9e;
        --body: rgb(202, 124, 94);
        --ok: #30d158;
        --warn: #ffd60a;
        --danger: #ff453a;
        --radius-xl: 18px;
        --radius-lg: 14px;
        --radius-md: 10px;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: var(--bg);
        color: var(--text);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 12% 10%, rgba(202, 124, 94, 0.1), transparent 34%),
          radial-gradient(circle at 84% 10%, rgba(132, 132, 132, 0.12), transparent 32%),
          repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.03) 0,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px,
            transparent 5px
          );
        opacity: 0.38;
        z-index: 0;
      }

      .app {
        max-width: 980px;
        margin: 0 auto;
        min-height: 100%;
        padding: 14px 14px 84px;
        position: relative;
        z-index: 1;
      }

      .page-header {
        padding: 8px 4px 18px;
        display: grid;
        gap: 8px;
        justify-content: center;
      }

      .page-header h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 58px);
        line-height: 1.08;
        letter-spacing: 0.2px;
        text-align: center;
      }

      .page-header p {
        margin: 0;
        color: var(--text-dim);
        font-size: clamp(14px, 2.4vw, 22px);
        line-height: 1.5;
        max-width: 62ch;
        text-align: center;
      }

      .section-title {
        margin: 16px 0 10px;
        font-size: 15px;
        font-weight: 700;
        color: var(--body);
        letter-spacing: 0.35px;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .card {
        border: 1px solid var(--stroke);
        border-radius: var(--radius-lg);
        background: var(--panel-soft);
        backdrop-filter: blur(7px);
        box-shadow: var(--shadow);
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .q {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.42;
      }

      .required {
        color: var(--warn);
        margin-left: 4px;
      }

      .hint {
        margin: 0;
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.45;
      }

      .grid {
        display: grid;
        gap: 10px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 9px;
        border: 1px solid var(--stroke-soft);
        background: rgba(255, 255, 255, 0.02);
        transition: border-color 160ms ease, background 160ms ease;
      }

      .row:hover {
        border-color: rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.05);
      }

      label {
        cursor: pointer;
      }

      input[type="text"],
      textarea {
        width: 100%;
        border: 1px solid var(--stroke-soft);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.28);
        font: inherit;
        color: var(--text);
      }

      input[type="text"]::placeholder,
      textarea::placeholder {
        color: var(--text-dim);
      }

      input[type="radio"] {
        accent-color: var(--body);
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .stars {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .star-rating {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .star-btn {
        appearance: none;
        border: none;
        background: transparent;
        padding: 0;
        margin: 0;
        min-height: auto;
        min-width: auto;
        line-height: 1;
        font-size: 24px;
        color: var(--warn);
        cursor: pointer;
        transform-origin: center;
        transition: transform 120ms ease, filter 160ms ease;
      }

      .star-btn:hover {
        background: transparent;
        border: none;
        transform: scale(1.08);
        filter: brightness(1.1);
      }

      .star-btn:active {
        transform: scale(0.96);
      }

      .star-hidden-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .actions {
        margin-top: 6px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      button {
        appearance: none;
        border: 1px solid var(--stroke-soft);
        background: transparent;
        color: var(--text);
        border-radius: 12px;
        min-height: 40px;
        padding: 8px 12px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, background 160ms ease, border-color 160ms ease;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.45);
      }

      button:active {
        transform: translateY(1px);
      }

      .btn-accent {
        color: var(--body);
        border-color: rgb(202, 124, 94);
      }

      .btn-danger {
        color: #fff;
        border-color: #fff;
      }

      .msg {
        margin-top: 8px;
        min-height: 20px;
        font-size: 12px;
      }

      .msg.ok {
        color: var(--ok);
      }

      .msg.err {
        color: var(--danger);
      }

      .foot {
        margin-top: 8px;
        color: var(--text-dim);
        font-size: 11px;
      }

      .modal-mask {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.68);
        z-index: 30;
      }

      .modal-mask[hidden] {
        display: none;
      }

      .modal {
        width: min(460px, 100%);
        border: 1px solid var(--stroke);
        border-radius: var(--radius-lg);
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 16px 14px;
      }

      .modal h3 {
        margin: 0 0 8px;
        font-size: 16px;
        color: var(--body);
      }

      .modal p {
        margin: 0;
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.6;
      }

      .modal-actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
      }

      @media (max-width: 720px) {
        .actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="page-header">
        <h1>Agent Limbo</h1>
        <p>
          总共13个问题，6-9 分钟即可完成。<br />
          问卷匿名，仅用于产品优化。
        </p>
      </header>

      <form id="surveyForm" class="stack">
        <section class="card">
          <h2 class="q">1. 你本次主要使用了哪些端？<span class="required">*</span></h2>
          <div class="grid">
            <label class="row"><input type="radio" name="terminalUsed" value="watch" /> Apple Watch</label>
            <label class="row"><input type="radio" name="terminalUsed" value="iphone" required /> iPhone</label>
            <label class="row"><input type="radio" name="terminalUsed" value="both" /> 两者都用了</label>
          </div>
        </section>

        <section class="card">
          <h2 class="q">2. 你的使用频率是？<span class="required">*</span></h2>
          <div class="grid">
            <label class="row"><input type="radio" name="usageFrequency" value="multiple_daily" required /> 每天多次</label>
            <label class="row"><input type="radio" name="usageFrequency" value="daily_once" /> 每天 1 次</label>
            <label class="row"><input type="radio" name="usageFrequency" value="weekly_2_3" /> 每周 2-3 次</label>
            <label class="row"><input type="radio" name="usageFrequency" value="weekly_or_less" /> 每周 1 次或更少</label>
          </div>
        </section>

        <section class="card">
          <h2 class="q">3. 你是通过什么场景使用本 App？<span class="required">*</span></h2>
          <div class="grid">
            <label class="row"><input type="radio" name="usageScenarios" value="watch_view_approve_status" required /> Agent 工作时能够在「手表」上查看、审批它</label>
            <label class="row"><input type="radio" name="usageScenarios" value="iphone_view_approve_status" /> Agent 工作时能够在「手机」上查看、审批它</label>
            <label class="row"><input type="radio" name="usageScenarios" value="im_view_approve_status" /> Agent 工作时能够在「飞书/微信/钉钉等 IM 工具」上查看、审批它的状态</label>
            <label class="row"><input type="radio" name="usageScenarios" value="try_only" /> 仅尝鲜、体验</label>
            <label class="row"><input type="radio" name="usageScenarios" value="other" /> 其他（请补充）</label>
          </div>
          <div>
            <input id="usageScenariosOther" name="usageScenariosOther" type="text" maxlength="200" placeholder="其他场景补充" />
          </div>
        </section>

        <section class="card">
          <h2 class="q">4～12. 体验评分（1-5 分）</h2>
          <p class="hint">可按直觉快速勾选，不需要在每项停留太久。</p>
          <div class="grid">
            <div>
              <label>4. iPhone 上首次安装与启动 App 是否顺利？</label>
              <div class="stars" data-score="installIphoneScore"></div>
            </div>
            <div>
              <label>5. Apple Watch 上首次安装与启动 App 是否顺利？</label>
              <div class="stars" data-score="installWatchScore"></div>
            </div>
            <div>
              <label>6. 首次安装、启动 App 后出现的权限引导是否清晰易懂？</label>
              <div class="stars" data-score="permissionGuideScore"></div>
            </div>
            <div>
              <label>7. 登录过程是否稳定（无卡顿/无崩溃）？</label>
              <div class="stars" data-score="loginStabilityScore"></div>
            </div>
            <div>
              <label>8. 将 Agent 与 iPhone/Watch 的配对流程是否顺畅？</label>
              <div class="stars" data-score="pairingFlowScore"></div>
            </div>
            <div>
              <label>9. 清楚知道 Agent 与 iPhone/Watch 的配对状态吗？</label>
              <div class="stars" data-score="pairingStatusScore"></div>
            </div>
            <div>
              <label>10. 审批消息到达是否及时？</label>
              <div class="stars" data-score="approvalArrivalScore"></div>
            </div>
            <div>
              <label>11. 审批操作（Yes/No）是否可靠生效？</label>
              <div class="stars" data-score="approvalReliabilityScore"></div>
            </div>
            <div>
              <label>12. 你对当前审批卡信息完整度的满意度（工具名称、指令、发生时间和等待时长）？</label>
              <div class="stars" data-score="cardCompletenessScore"></div>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 class="q">13. 你最希望下个版本优先修复、优化或增加功能的是？<span class="required">*</span></h2>
          <div class="grid">
            <label class="row"><input type="radio" name="nextPriority" value="more_agents" required /> 支持更多 Agent 的接入，比如 Codex</label>
            <label class="row"><input type="radio" name="nextPriority" value="pairing_simpler" /> Agent 与手表的配对流程更简单</label>
            <label class="row"><input type="radio" name="nextPriority" value="card_more_complete" /> 审批卡信息更完整</label>
            <label class="row"><input type="radio" name="nextPriority" value="other" /> 其它</label>
          </div>
          <div>
            <input id="nextPriorityOther" name="nextPriorityOther" type="text" maxlength="200" placeholder="若选其它，请补充" />
          </div>
        </section>

        <section class="card">
          <h2 class="q">补充反馈（可选）</h2>
          <textarea id="extraFeedback" name="extraFeedback" placeholder="你希望我们重点关注什么问题？"></textarea>
        </section>

        <div class="actions">
          <button class="btn-accent" type="submit">提交问卷</button>
          <button class="btn-danger" type="button" id="resetBtn">重置</button>
        </div>
          <div id="result" class="msg"></div>
      </form>
    </div>

    <div id="successModalMask" class="modal-mask" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="successModalTitle">
        <h3 id="successModalTitle">提交成功</h3>
        <p>感谢你的反馈，我们会基于本次问卷持续优化 Agent Limbo 产品体验。</p>
        <div class="modal-actions">
          <button id="successModalConfirm" class="btn-accent" type="button">知道了</button>
        </div>
      </div>
    </div>

    <script>
      function createScoreChips(container, name) {
        const ratingWrap = document.createElement("div");
        ratingWrap.className = "star-rating";

        const hiddenInput = document.createElement("input");
        hiddenInput.type = "hidden";
        hiddenInput.name = name;
        hiddenInput.value = "";
        hiddenInput.className = "star-hidden-input";
        ratingWrap.appendChild(hiddenInput);

        const starButtons = [];

        function renderStars(selectedValue) {
          const selected = Number.parseInt(String(selectedValue || ""), 10) || 0;
          starButtons.forEach((btn, index) => {
            const starLevel = index + 1;
            const active = starLevel <= selected;
            btn.textContent = active ? "⭐" : "☆";
            btn.setAttribute("aria-pressed", active ? "true" : "false");
          });
        }

        for (let i = 1; i <= 5; i += 1) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "star-btn";
          btn.setAttribute("aria-label", `${i} 分`);
          btn.dataset.value = String(i);
          btn.addEventListener("click", () => {
            hiddenInput.value = String(i);
            renderStars(i);
          });
          starButtons.push(btn);
          ratingWrap.appendChild(btn);
        }

        container.appendChild(ratingWrap);
        renderStars(0);
      }

      document.querySelectorAll(".stars").forEach((el) => {
        const name = el.getAttribute("data-score");
        if (name) {
          createScoreChips(el, name);
        }
      });

      const form = document.getElementById("surveyForm");
      const result = document.getElementById("result");
      const resetBtn = document.getElementById("resetBtn");
      const successModalMask = document.getElementById("successModalMask");
      const successModalConfirm = document.getElementById("successModalConfirm");
      const trackedQueryKeys = [
        "username",
        "email",
        "appVersion",
        "appBuild",
        "appBundleID",
        "iosVersion",
        "device",
        "host",
        "pushNotificationEnabled",
        "tokenPersent",
      ];

      function readSurveyQueryContext() {
        const params = new URLSearchParams(window.location.search || "");
        const context = {};
        for (const key of trackedQueryKeys) {
          const value = String(params.get(key) || "").trim();
          if (!value) {
            continue;
          }
          context[key] = value;
        }
        return context;
      }

      function getRadioValue(name) {
        const el = form.querySelector(`input[name="${name}"]:checked`);
        return el ? el.value : "";
      }

      function getScore(name) {
        const input = form.querySelector(`input[name="${name}"]`);
        const value = input ? String(input.value || "").trim() : "";
        if (!value) {
          return null;
        }
        const n = Number.parseInt(value, 10);
        if (!Number.isFinite(n) || n < 1 || n > 5) {
          return null;
        }
        return n;
      }

      function getCheckedValues(name) {
        return Array.from(form.querySelectorAll(`input[name="${name}"]:checked`)).map((item) => item.value);
      }

      function getOptionalInputValue(id) {
        const el = document.getElementById(id);
        return el ? String(el.value || "").trim() : "";
      }

      function setMessage(text, ok) {
        result.textContent = text;
        result.className = ok ? "msg ok" : "msg err";
      }

      function openSuccessModal() {
        successModalMask.hidden = false;
      }

      function closeSuccessModal() {
        successModalMask.hidden = true;
      }

      successModalConfirm.addEventListener("click", closeSuccessModal);

      successModalMask.addEventListener("click", (event) => {
        if (event.target === successModalMask) {
          closeSuccessModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !successModalMask.hidden) {
          closeSuccessModal();
        }
      });

      resetBtn.addEventListener("click", () => {
        form.reset();
        document.querySelectorAll(".stars").forEach((el) => {
          el.innerHTML = "";
          const name = el.getAttribute("data-score");
          if (name) {
            createScoreChips(el, name);
          }
        });
        setMessage("", true);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setMessage("正在提交...", true);
        const queryContext = readSurveyQueryContext();

        const usageScenarios = getCheckedValues("usageScenarios");
        if (usageScenarios.length === 0) {
          setMessage("请选择一个使用场景。", false);
          return;
        }

        const payload = {
          userId: getOptionalInputValue("userId"),
          username: getOptionalInputValue("username"),
          contact: getOptionalInputValue("contact"),
          terminalUsed: getRadioValue("terminalUsed"),
          usageFrequency: getRadioValue("usageFrequency"),
          usageScenarios,
          usageScenariosOther: getOptionalInputValue("usageScenariosOther"),
          installIphoneScore: getScore("installIphoneScore"),
          installWatchScore: getScore("installWatchScore"),
          permissionGuideScore: getScore("permissionGuideScore"),
          loginStabilityScore: getScore("loginStabilityScore"),
          pairingFlowScore: getScore("pairingFlowScore"),
          pairingStatusScore: getScore("pairingStatusScore"),
          approvalArrivalScore: getScore("approvalArrivalScore"),
          approvalReliabilityScore: getScore("approvalReliabilityScore"),
          cardCompletenessScore: getScore("cardCompletenessScore"),
          nextPriority: getRadioValue("nextPriority"),
          nextPriorityOther: getOptionalInputValue("nextPriorityOther"),
          extraFeedback: getOptionalInputValue("extraFeedback"),
          source: "watch-alpha-web",
          ...queryContext,
        };

        if (!payload.terminalUsed || !payload.usageFrequency || !payload.nextPriority) {
          setMessage("请先完成所有必填题。", false);
          return;
        }

        try {
          const response = await fetch("/api/surveys/watch-alpha", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data?.ok) {
            throw new Error(data?.error || `请求失败（${response.status}）`);
          }

          setMessage("", true);
          form.reset();
          document.querySelectorAll(".stars").forEach((el) => {
            el.innerHTML = "";
            const name = el.getAttribute("data-score");
            if (name) {
              createScoreChips(el, name);
            }
          });
          openSuccessModal();
        } catch (error) {
          setMessage(`提交失败：${String(error?.message || error)}`, false);
        }
      });
    </script>
  </body>
</html>
