<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloud Auth Users</title>
    <style>
      @layer legacy {
      :root {
        --bg: #f3f6fb;
        --card: #ffffff;
        --border: #dbe3ec;
        --text: #1f2a37;
        --muted: #607080;
        --accent: #0d8ddb;
        --accent-2: #0967ab;
        --danger: #c4382b;
      }
      body {
        margin: 0;
        font-family: "SF Mono", Menlo, Consolas, monospace;
        background: linear-gradient(135deg, #eef5ff 0%, #f8fafc 48%, #eef6ef 100%);
        color: var(--text);
      }
      .wrap {
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 16px 24px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .hero h1 {
        margin: 0;
        font-size: 22px;
      }
      .hero p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .curl-request {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
      }
      .curl-request code {
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        overflow-wrap: anywhere;
      }
      .nav a {
        display: inline-block;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        text-decoration: none;
        color: var(--text);
        background: rgba(255, 255, 255, 0.8);
      }
      .grid {
        display: grid;
        grid-template-columns: 1.5fr 0.5fr;
        gap: 16px;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 12px 30px rgba(16, 24, 40, 0.06);
      }
      .panel h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .stack {
        display: grid;
        gap: 10px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      input {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        min-width: 220px;
        font: inherit;
        color: var(--text);
        background: #fff;
      }
      button {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-2);
        border-color: var(--accent-2);
      }
      button.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .error {
        color: var(--danger);
      }
      .status-box {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #f8fbff;
      }
      .token-cell {
        max-width: 320px;
        word-break: break-all;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f7f9fb;
      }
      .empty {
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .hero {
          flex-direction: column;
          align-items: flex-start;
        }
      }
      }
    </style>
    <link rel="stylesheet" href="/limbo-ui.css" />
    <script src="/limbo-ui.js" defer></script>
  </head>
  <body class="lm-users" data-page="users">
    <div class="wrap">
      <div class="hero">
        <div>
          <h1>用户管理</h1>
          <p>接口：<code>GET /auth/users</code>；必要认证：管理员 Bearer Token；可选参数：<code>limit</code>，返回用户数量上限，当前为 100。</p>
          <div class="curl-request">
            <code id="usersCurl">正在生成 cURL...</code>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>已知用户</h2>
          <div class="meta" id="usersSummary">Loading users...</div>
          <div id="usersTable" style="margin-top: 12px;"></div>
          <div class="row" style="margin-top: 16px;">
            <button id="addUser" class="primary" type="button">添加用户</button>
            <button id="refreshUsers" type="button">刷新列表</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const refreshUsersBtn = $("refreshUsers");
      const addUserBtn = $("addUser");
      const usersTableEl = $("usersTable");
      const usersSummaryEl = $("usersSummary");
      const usersCurlEl = $("usersCurl");

      function ts(ms) {
        if (!ms) return "-";
        return new Date(ms).toLocaleString();
      }

      async function fetchJson(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
            ...(options.headers || {}),
          },
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || response.statusText || "request failed");
        }
        return payload;
      }

      function renderUsersTable(items) {
        if (!Array.isArray(items) || items.length === 0) {
          usersSummaryEl.textContent = "No users yet.";
          usersTableEl.innerHTML = '<p class="empty">No users yet.</p>';
          return;
        }

        usersSummaryEl.textContent = "Loaded " + items.length + " users.";
        let html =
          "<table><thead><tr>" +
          "<th>User ID</th>" +
          "<th>User Name</th>" +
          "<th>Auth Type</th>" +
          "<th>Device Token</th>" +
          "<th>Auth Token</th>" +
          "<th>Pairing Code</th>" +
          "<th>Code Expires</th>" +
          "<th>Updated</th>" +
          "<th>Action</th>" +
          "</tr></thead><tbody>";

        for (const item of items) {
          html +=
            "<tr>" +
            "<td>" + (item.userId || "-") + "</td>" +
            "<td>" + (item.username || "-") + "</td>" +
            "<td>" + ((item.authType || "user") + (item.isAdmin ? " / admin" : "")) + "</td>" +
            '<td class="token-cell">' + (item.deviceToken || "-") + "</td>" +
            '<td class="token-cell">' + (item.authToken || "-") + "</td>" +
            "<td>" + (item.pairingCode || '<button class="create-code" type="button" data-user-id="' + item.userId + '">创建</button>') + "</td>" +
            "<td>" + (item.pairingCodeExpiresAtMs ? ts(item.pairingCodeExpiresAtMs) : "-") + "</td>" +
            "<td>" + ts(item.updatedAtMs || item.createdAtMs || 0) + "</td>" +
            '<td><a href="/intercepts/approve?token=' + encodeURIComponent(item.authToken || "") + '">审批</a><br/><a href="/usage?token=' + encodeURIComponent(item.authToken || "") + '">用量</a></td>' +
            "</tr>";
        }

        html += "</tbody></table>";
        usersTableEl.innerHTML = html;
      }

      async function refreshUsers() {
        usersSummaryEl.textContent = "Refreshing users...";
        const payload = await fetchJson("/auth/users?limit=100");
        const admin = (payload.items || []).find((item) => item.isAdmin && item.authToken);
        if (admin) {
          usersCurlEl.textContent = `curl -sS -H 'Accept: application/json' -H 'Authorization: Bearer ${admin.authToken}' '${location.origin}/auth/users?limit=100'`;
        } else {
          usersCurlEl.textContent = "未找到可用于 cURL 的管理员 Token";
        }
        renderUsersTable(payload.items || []);
      }

      usersTableEl.addEventListener("click", async (event) => {
        const button = event.target.closest(".create-code");
        if (!button) return;
        button.disabled = true;
        try {
          await fetchJson("/auth/users/pairing-code", {
            method: "POST",
            body: JSON.stringify({ userId: button.dataset.userId }),
          });
          await refreshUsers();
        } catch (error) {
          usersSummaryEl.textContent = String(error.message || error);
          usersSummaryEl.className = "error";
        } finally {
          button.disabled = false;
        }
      });

      refreshUsersBtn.addEventListener("click", async () => {
        refreshUsersBtn.disabled = true;
        try {
          await refreshUsers();
        } catch (error) {
          usersSummaryEl.textContent = String(error.message || error);
          usersSummaryEl.className = "error";
        } finally {
          refreshUsersBtn.disabled = false;
        }
      });

      addUserBtn.addEventListener("click", async () => {
        const username = window.prompt("用户名");
        if (!username || !username.trim()) return;
        addUserBtn.disabled = true;
        try {
          await fetchJson("/auth/users", {
            method: "POST",
            body: JSON.stringify({ username: username.trim() }),
          });
          await refreshUsers();
        } catch (error) {
          usersSummaryEl.textContent = String(error.message || error);
          usersSummaryEl.className = "error";
        } finally {
          addUserBtn.disabled = false;
        }
      });

      refreshUsers().catch((error) => {
        usersSummaryEl.textContent = String(error.message || error);
        usersSummaryEl.className = "error";
      });
    </script>
  </body>
</html>
